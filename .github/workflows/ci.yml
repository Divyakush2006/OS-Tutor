name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-suites:
    name: CPU test suites (323 checks on a clean clone)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    # tools/test_router.py is not run here: it classifies questions with the live model
    # and needs llama-server on :8081.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only PyTorch, then the project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache the MiniLM embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Download the MiniLM embedding model (retrieval loads it offline, by design)
        run: |
          for attempt in 1 2 3 4; do
            python -c "from huggingface_hub import snapshot_download; snapshot_download('sentence-transformers/all-MiniLM-L6-v2')" && break
            echo "download failed (attempt $attempt), retrying"; sleep 15
          done
          python -c "from huggingface_hub import snapshot_download; snapshot_download('sentence-transformers/all-MiniLM-L6-v2', local_files_only=True)"

      - name: Data pipeline, simulators, release gates (122 checks)
        run: python tools/test_pipeline.py

      - name: Retrieval (67 checks)
        run: python tools/test_rag.py

      - name: Measurement code (58 checks)
        run: python tools/test_g0.py

      - name: Gateway (76 checks)
        run: python serve/test_gateway.py
